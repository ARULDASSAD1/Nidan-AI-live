<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nidan-Live | Triage Scan</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f172a;
            --panel-bg: #1e293b;
            --accent: #10b981;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .dashboard {
            background-color: var(--panel-bg);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
            width: 100%;
            max-width: 450px;
            text-align: center;
            border: 1px solid #334155;
        }

        h1 { margin-top: 0; font-size: 24px; letter-spacing: 1px; color: #38bdf8; }
        .subtitle { color: var(--text-muted); font-size: 14px; margin-bottom: 30px; }

        .video-container {
            position: relative;
            width: 100%;
            border-radius: 15px;
            overflow: hidden;
            border: 2px solid #334155;
            background-color: #000;
            margin-bottom: 20px;
        }

        video {
            width: 100%;
            display: block;
            transform: scaleX(-1); /* Mirror the webcam */
        }

        /* The futuristic scanning line */
        .scan-line {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background-color: var(--accent);
            box-shadow: 0 0 15px var(--accent);
            opacity: 0;
            z-index: 10;
        }

        @keyframes scan {
            0% { top: 0%; opacity: 1; }
            50% { top: 100%; opacity: 1; }
            100% { top: 0%; opacity: 1; }
        }

        .scanning .scan-line { animation: scan 2s linear infinite; }

        button {
            background-color: #38bdf8;
            color: #0f172a;
            border: none;
            padding: 16px 0;
            width: 100%;
            font-size: 16px;
            font-weight: 700;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        button:hover { background-color: #0ea5e9; color: white; }
        button:disabled { background-color: #334155; color: #64748b; cursor: not-allowed; }

        /* Simulated Pulse Waveform Visualizer */
        .waveform {
            height: 40px;
            margin: 20px 0;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .waveform.active { opacity: 1; }

        .bar {
            width: 4px;
            background-color: var(--accent);
            border-radius: 2px;
            animation: pulse 1s infinite ease-in-out;
        }

        .bar:nth-child(1) { height: 10px; animation-delay: 0.1s; }
        .bar:nth-child(2) { height: 25px; animation-delay: 0.2s; }
        .bar:nth-child(3) { height: 40px; animation-delay: 0.3s; }
        .bar:nth-child(4) { height: 25px; animation-delay: 0.4s; }
        .bar:nth-child(5) { height: 10px; animation-delay: 0.5s; }

        @keyframes pulse {
            0%, 100% { transform: scaleY(0.3); }
            50% { transform: scaleY(1); }
        }

        /* New Multi-Metric Results Panel */
        #result-panel {
            margin-top: 25px;
            display: none;
        }

        .metrics-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .metric-card {
            background: #334155;
            padding: 15px;
            border-radius: 12px;
            text-align: center;
            border: 1px solid #475569;
        }

        .metric-card.full-width {
            grid-column: span 2;
        }

        .metric-title {
            font-size: 12px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 5px;
        }

        .metric-value {
            font-size: 22px;
            font-weight: 700;
            color: var(--accent);
        }

        .stress-value {
            color: #f59e0b; /* Orange warning color for stress */
            font-size: 18px;
        }

        .triage-badge {
            display: block;
            padding: 12px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 14px;
            margin-top: 15px;
            color: white;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        /* Dynamic Triage Colors */
        .priority-1 { background-color: #991b1b; } /* Critical */
        .priority-2 { background-color: #ef4444; } /* Urgent */
        .priority-3 { background-color: #f59e0b; } /* Moderate */
        .priority-4 { background-color: #3b82f6; } /* Standard */
        .priority-5 { background-color: #10b981; } /* Non-Urgent */

    </style>
</head>
<body>

    <div class="dashboard">
        <h1>NIDAN-LIVE SYSTEM</h1>
        <div class="subtitle">AI-Powered Distributed Triage • Final Build</div>

        <div class="video-container" id="video-container">
            <div class="scan-line" id="scan-line"></div>
            <video id="videoElement" autoplay muted playsinline></video>
        </div>

        <div class="waveform" id="waveform">
            <div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div>
        </div>

        <button id="scanBtn">Initiate 10-Second Scan</button>
        
        <div id="result-panel">
            <div class="metrics-grid">
                <div class="metric-card">
                    <div class="metric-title">Heart Rate</div>
                    <div class="metric-value" id="bpm-val">--</div>
                </div>
                <div class="metric-card">
                    <div class="metric-title">Respiration</div>
                    <div class="metric-value" id="resp-val">--</div>
                </div>
                <div class="metric-card full-width">
                    <div class="metric-title">Systemic Stress Index</div>
                    <div class="metric-value stress-value" id="stress-val">--</div>
                </div>
            </div>
            <div id="triage-badge" class="triage-badge priority-5">Awaiting Scan</div>
        </div>
    </div>

    <script>
        const video = document.getElementById('videoElement');
        const videoContainer = document.getElementById('video-container');
        const waveform = document.getElementById('waveform');
        const scanBtn = document.getElementById('scanBtn');
        const resultPanel = document.getElementById('result-panel');
        
        const bpmVal = document.getElementById('bpm-val');
        const respVal = document.getElementById('resp-val');
        const stressVal = document.getElementById('stress-val');
        const triageBadge = document.getElementById('triage-badge');
        
        let mediaRecorder;
        let recordedChunks = [];

        // Access webcam
        navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } })
            .then(stream => { video.srcObject = stream; })
            .catch(err => alert("Camera access required for Nidan-Live scanner."));

        scanBtn.addEventListener('click', async () => {
            // Start UI animations
            scanBtn.disabled = true;
            scanBtn.innerText = "Extracting Vitals... (Keep Still)";
            resultPanel.style.display = 'none';
            videoContainer.classList.add('scanning');
            waveform.classList.add('active');
            recordedChunks = [];

            const stream = video.srcObject;
            mediaRecorder = new MediaRecorder(stream, { mimeType: 'video/webm' });
            
            mediaRecorder.ondataavailable = event => {
                if (event.data.size > 0) recordedChunks.push(event.data);
            };

            mediaRecorder.onstop = async () => {
                // Stop UI animations
                videoContainer.classList.remove('scanning');
                waveform.classList.remove('active');
                scanBtn.innerText = "AI Processing Data...";
                
                const blob = new Blob(recordedChunks, { type: 'video/webm' });
                const formData = new FormData();
                formData.append('video', blob, 'scan.webm');

                try {
                    // Send video to the FastAPI backend
                    const response = await fetch('http://localhost:8000/api/scan', {
                        method: 'POST',
                        body: formData
                    });
                    const data = await response.json();
                    
                    resultPanel.style.display = 'block';
                    
                    if(data.vitals.status === "success") {
                        // Populate the 3 metrics
                        bpmVal.innerText = `${data.vitals.bpm} BPM`;
                        respVal.innerText = `${data.vitals.respiration_rate} BrPM`;
                        stressVal.innerText = data.vitals.stress_level;
                        
                        // Update Triage Badge Text and Color Class
                        triageBadge.innerText = `Priority ${data.triage_priority}: Routing to ${data.recommended_facility}`;
                        triageBadge.className = `triage-badge priority-${data.triage_priority}`;
                    } else {
                        // Handle failure gracefully
                        bpmVal.innerText = "ERR";
                        respVal.innerText = "ERR";
                        stressVal.innerText = "SIGNAL FAILED";
                        triageBadge.innerText = data.vitals.message;
                        triageBadge.className = 'triage-badge priority-1'; // Make it red to alert user
                    }
                } catch (err) {
                    resultPanel.style.display = 'block';
                    bpmVal.innerText = "N/A";
                    respVal.innerText = "N/A";
                    stressVal.innerText = "OFFLINE";
                    triageBadge.innerText = "SERVER CONNECTION ERROR";
                    triageBadge.className = 'triage-badge priority-1';
                }
                
                scanBtn.disabled = false;
                scanBtn.innerText = "Initiate New Scan";
            };

            mediaRecorder.start();
            // Record for exactly 10 seconds
            setTimeout(() => { mediaRecorder.stop(); }, 10000); 
        });
    </script>

</body>
</html>
